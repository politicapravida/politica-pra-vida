<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Política pra vida</title>
<style>
  :root {
    --fundo: #f2efe6;
    --texto: #1d2a44;
    --destaque: #c8372d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #14192b; --texto: #f2efe6; --destaque: #ff6b5e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 32rem; }
  .post {
    width: 200px;
    height: 120px;
    margin: 0 auto 28px;
    background: #bdbdbd;
    border-radius: 12px;
  }
  h1 { font-size: 2.4rem; line-height: 1.1; margin: 0 0 12px; }
  p { font-size: 1.15rem; line-height: 1.5; margin: 0 0 8px; }
  .coracao { color: var(--destaque); font-size: 1.6rem; }
</style>
</head>
<body>
<main>
  <div class="post" role="img" aria-label="Espaço de foto de um post"></div>
  <h1>Política pra vida</h1>
  <p>Aponte, curta, descubra.</p>
  <p><span class="coracao" aria-hidden="true">&#10084;</span> O jogo estará aqui em breve.</p>
</main>
</body>
</html>
